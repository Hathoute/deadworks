{{/*
Steam credentials — rendered into a Secret rather than the ConfigMap.
Skipped when `existingEnvSecret` points at a user-managed Secret.
*/}}
{{- if not .Values.existingEnvSecret }}
{{- if not .Values.steam.user }}
{{- fail "steam.user is required (or provide STEAM_LOGIN via existingEnvSecret)" }}
{{- end }}
{{- if not .Values.steam.password }}
{{- fail "steam.password is required (or provide STEAM_PASSWORD via existingEnvSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deadworks.envSecretName" . }}
  labels:
    {{- include "deadworks.labels" . | nindent 4 }}
type: Opaque
stringData:
  STEAM_LOGIN: {{ required "steam.user is required" .Values.steam.user | quote }}
  STEAM_PASSWORD: {{ required "steam.password is required" .Values.steam.password | quote }}
{{- end }}
